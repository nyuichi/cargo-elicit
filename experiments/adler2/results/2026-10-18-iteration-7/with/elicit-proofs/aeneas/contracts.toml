schema_version = 1

[contracts."adler2::adler32_slice::Function"]
ensures = "fun data out => out.val = AdlerSpec.packed (AdlerSpec.update 1 0 data.val)"
theorem = "adler32_slice_correct"

[contracts."adler2::algo::impl[ff6e69000b04949b]::compute::Method"]
ensures = "fun self bytes out => (out.a.val, out.b.val) = AdlerSpec.update self.a.val self.b.val bytes.val"
theorem = "compute_correct"

[contracts."adler2::algo::impl[16f54fa5277eca59]::from::Method"]
requires = "fun bytes => 4 ≤ bytes.val.length"
ensures = "fun bytes out => out.val.map (fun x => x.val) = (bytes.val.take 4).map (fun x => x.val)"
theorem = "lane_from_correct"

[contracts."adler2::impl[ff6e69000b04949b]::new::Method"]
ensures = "fun out => out.a.val = 1 ∧ out.b.val = 0"
theorem = "new_correct"

[contracts."adler2::impl[ff6e69000b04949b]::checksum::Method"]
ensures = "fun self out => out.val = 65536*self.b.val + self.a.val"
theorem = "checksum_correct"

[contracts."adler2::impl[ff6e69000b04949b]::from_checksum::Method"]
ensures = "fun sum out => out.a.val = sum.val % 65536 ∧ out.b.val = sum.val / 65536"
theorem = "from_checksum_correct"
