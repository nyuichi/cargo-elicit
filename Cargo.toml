[package]
name = "cargo-elicit"
version = "0.2.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "Model-independent Rust verification workflow and evidence tracking"
repository = "https://github.com/proofs-rs/cargo-elicit"

readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "skills/**"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
fs2 = "0.4"
tempfile = "3"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
ctrlc = "3"
libc = "0.2"
url = { version = "2", features = ["serde"] }


# Broad content fingerprints also cover installed verifier/model files. Keep
# hashing practical in debug CLI and native test builds.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
